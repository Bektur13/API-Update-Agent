name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # core's exports point at dist/, so lint (type-aware) and tests need it built first
      - run: npm run build

      - run: npm run lint

      - run: npm test
